spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: streaming
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
