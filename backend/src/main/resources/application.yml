spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: streaming
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    supabase:
      endpoint: ${SUPABASE_STORAGE_ENDPOINT:}
      region: ${SUPABASE_STORAGE_REGION:}
      access-key-id: ${SUPABASE_STORAGE_ACCESS_KEY_ID:}
      secret-access-key: ${SUPABASE_STORAGE_SECRET_ACCESS_KEY:}
      avatars-bucket: ${SUPABASE_STORAGE_AVATARS_BUCKET:avatars}
      thumbnails-bucket: ${SUPABASE_STORAGE_THUMBNAILS_BUCKET:thumbnails}
      recordings-bucket: ${SUPABASE_STORAGE_RECORDINGS_BUCKET:recordings}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}
  stream:
    credential-encryption-key: ${STREAM_CREDENTIAL_ENCRYPTION_KEY:}
  ingest:
    rtmp-url: ${INGEST_RTMP_URL:}
    callback-secret: ${INGEST_CALLBACK_SECRET:}
    playback-base-url: ${INGEST_PLAYBACK_BASE_URL:http://localhost:8081/hls/live}
    srs-control-url: ${SRS_CONTROL_URL:}
    srs-control-secret: ${SRS_CONTROL_SECRET:}
    reconnect-grace-period: ${RECONNECT_GRACE_PERIOD:PT15S}
    scheduled-stream-ttl: ${SCHEDULED_STREAM_TTL:PT24H}
    start-request-ttl: ${START_REQUEST_TTL:PT5M}
    publisher-confirmation-timeout: ${PUBLISHER_CONFIRMATION_TIMEOUT:PT30S}
    lifecycle-poll-interval-ms: ${STREAM_LIFECYCLE_POLL_INTERVAL_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
