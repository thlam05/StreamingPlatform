spring:
  datasource:
    url: jdbc:h2:mem:streaming_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  storage:
    supabase:
      endpoint: https://storage.test/storage/v1/s3
      region: test-region
      access-key-id: test-access-key
      secret-access-key: test-secret-key
      avatars-bucket: avatars
      thumbnails-bucket: thumbnails
      recordings-bucket: recordings
  jwt:
    secret: test-only-secret-that-is-at-least-32-characters
    expiration: PT1H
  stream:
    credential-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  ingest:
    rtmp-url: rtmps://localhost/live
    callback-secret: test-callback-secret
