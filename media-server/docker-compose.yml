services:
  srs:
    image: ossrs/srs:7
    container_name: streaming-platform-media-server
    restart: unless-stopped
    command: ["./objs/srs", "-c", "/etc/srs/srs.conf"]
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8081:8080"
    volumes:
      - ./config/srs.conf:/etc/srs/srs.conf:ro
      - ./data/hls:/data/hls

  media-gateway:
    image: nginx:1.27-alpine
    container_name: streaming-platform-media-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
      INGEST_CALLBACK_SECRET: ${INGEST_CALLBACK_SECRET:-}
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

