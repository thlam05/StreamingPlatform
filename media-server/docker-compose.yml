services:
  srs:
    image: ossrs/srs:7
    container_name: streaming-platform-media-server
    restart: unless-stopped
    command: ["./objs/srs", "-c", "/etc/srs/srs.conf"]
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./config/srs.conf:/etc/srs/srs.conf:ro
      - ./data/hls:/data/hls

