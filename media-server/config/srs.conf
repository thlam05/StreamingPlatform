listen              1935;
max_connections     1000;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             /data;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://media-gateway:8082/srs/hooks;
        on_unpublish    http://media-gateway:8082/srs/hooks;
    }

    # Transcode every stream in the live application. SRS applies this app-level
    # rule to backend-generated UUID stream names as well.
    transcode live {
        enabled on;
        ffmpeg ./objs/ffmpeg/bin/ffmpeg;

        engine 720p {
            enabled on;
            vcodec libx264;
            vbitrate 2500;
            vfps 30;
            vwidth 1280;
            vheight 720;
            vthreads 2;
            vprofile main;
            vpreset veryfast;

            acodec aac;
            abitrate 128;
            asample_rate 48000;
            achannels 2;

            output rtmp://127.0.0.1:[port]/[app]?vhost=[vhost]/[stream]_[engine];
        }

        engine 360p {
            enabled on;
            vcodec libx264;
            vbitrate 800;
            vfps 30;
            vwidth 640;
            vheight 360;
            vthreads 2;
            vprofile baseline;
            vpreset veryfast;

            acodec aac;
            abitrate 96;
            asample_rate 48000;
            achannels 2;

            output rtmp://127.0.0.1:[port]/[app]?vhost=[vhost]/[stream]_[engine];
        }
    }

    hls {
        enabled             on;
        hls_fragment        6;
        hls_window          30;
        hls_wait_keyframe   on;
        hls_path            /data/hls;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
    }
}
